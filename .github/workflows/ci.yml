name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  security:
    name: Security (bandit, pip-audit, secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt bandit pip-audit
      - name: Static analysis for security issues (bandit)
        run: bandit -r . -x ./.venv,./venv --severity-level medium
      - name: Dependency vulnerability scan (pip-audit, informational)
        # Advisory only, not a merge gate: this app pins no transitive
        # versions, so findings in packages pulled in by streamlit/pandas
        # (pyarrow, pillow, etc.) fluctuate with every install and aren't
        # fixable from this repo. Direct dependencies are still worth fixing
        # when pip-audit flags them (see requirements.txt for pypdf).
        run: pip-audit || true
      - name: Check for committed secrets
        run: |
          if git grep -InE "sk-ant-[A-Za-z0-9_-]{20,}" -- . ':!*.md'; then
            echo "::error::Possible API key found in tracked files"
            exit 1
          fi
          if [ -f .streamlit/secrets.toml ]; then
            echo "::error::.streamlit/secrets.toml is committed -- it must stay gitignored"
            exit 1
          fi

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/ -v

  smoke:
    name: Boot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Boot the app and confirm it responds
        run: |
          streamlit run finapp.py --server.headless true --server.port 8501 &
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8501 || echo "000")
            if [ "$code" = "200" ]; then
              echo "App responded with HTTP 200 after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::App did not respond with HTTP 200 within 30s"
          exit 1
