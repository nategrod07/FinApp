[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
# A focused, deliberate rule set rather than the tool's broad implicit default:
# - E/F/W: real correctness issues (pyflakes, pycodestyle)
# - I: import sorting
# - UP: modernize syntax for the target Python version
# - B: flake8-bugbear (real bug patterns)
# - C4: flake8-comprehensions
# Deliberately excluded:
# - S (bandit-via-ruff): redundant with the standalone bandit CI job
# - BLE (blind except): this app deliberately uses broad except Exception as a
#   resilience pattern (AI calls, file parsing) so one bad file/response can't
#   crash the dashboard -- that's a design choice, not something to flag
# - ANN/D: this codebase doesn't use type hints and keeps comments minimal by
#   convention; requiring either would be an unrequested style rewrite
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
